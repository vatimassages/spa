<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vati Massage Spa</title>
  <meta name="description" content="Sistem manajemen Vati Massage Spa — Owner, Terapis & Pelanggan">
  <link rel="icon" type="image/jpeg" href="assets/img/logo.jpg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ===== Halaman Login / Register ===== -->
  <div id="auth-root"></div>

  <!-- ===== Shell aplikasi ===== -->
  <header class="topbar">
    <button class="hamburger" id="btn-menu" aria-label="Buka menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">
      <span class="logo"><img src="assets/img/logo.jpg" alt="Logo Vati Massage Spa"></span>
      Vati Massage Spa
    </div>
    <div class="topbar-right">
      <span class="demo-chip" id="demo-chip" style="display:none">MODE DEMO</span>
      <div class="user-chip" id="user-chip"></div>
    </div>
  </header>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Menu navigasi">
    <div class="drawer-brand">
      <span class="logo"><img src="assets/img/logo.jpg" alt="Logo Vati Massage Spa"></span>
      <div><b>Vati Massage Spa</b><small id="drawer-sub">Your Therapist</small></div>
      <button class="drawer-close" id="drawer-close" aria-label="Tutup menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <nav class="drawer-nav" id="drawer-nav"></nav>
    <div class="drawer-foot" id="drawer-foot">
      <button id="btn-logout">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Keluar
      </button>
    </div>
  </aside>

  <main id="app-main"></main>
  <div id="modal-root"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/views-booking.js"></script>
  <script src="assets/js/views-admin.js"></script>
  <script src="assets/js/views-terapis.js"></script>
  <script>
    if (!CFG.API_URL) document.getElementById('demo-chip').style.display = '';
  </script>
</body>
</html>
